<!doctype html>
<!-- Social preview card for WhatsApp, Telegram, LinkedIn etc. (1200x630).
     Rendered with a headless browser to static/pictures/preview.jpg.
     Image and font paths are relative to this file. -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Preview card</title>
<style>
  @font-face {
    font-family: "Archivo";
    src: url("../static/fonts/archivo-latin-wdth-normal.woff2") format("woff2");
    font-weight: 100 900; font-stretch: 62% 125%;
  }
  html, body { margin: 0; background: #000; }
  .card {
    position: relative; width: 1200px; height: 630px; overflow: hidden;
    background: #000; color: #EBE9E6; font-family: "Archivo", sans-serif;
  }
  .copy { position: absolute; left: 72px; top: 0; bottom: 0; width: 640px;
    display: flex; flex-direction: column; justify-content: center; }
  .name { font-variation-settings: "wdth" 82; font-size: 26px; color: #9A9894; margin: 0 0 22px; }
  h1 { margin: 0 0 30px; font-weight: 800; font-variation-settings: "wdth" 125;
    font-size: 86px; line-height: .86; white-space: nowrap; letter-spacing: -0.035em; color: #fff; }
  h1 span { display: block; color: #EE6C4D; }
  .lede { margin: 0; font-size: 28px; line-height: 1.35; max-width: 30ch; }
  .url { position: absolute; left: 72px; bottom: 44px; margin: 0;
    font-variation-settings: "wdth" 82; font-size: 22px; color: #9A9894; }
  /* the homepage portrait: photo through the brand triangle, coral triangle offset behind */
  .portrait { position: absolute; right: 40px; top: 50px; width: 540px; height: 540px; }
  .portrait .tri { position: absolute; inset: 0; translate: -5% 5%;
    background: #EE6C4D; clip-path: polygon(0% 100%, 25.8% 0%, 100% 72.3%); }
  .portrait img { position: absolute; inset: 0; width: 100%; height: 100%;
    object-fit: cover; object-position: 100% 0%;
    clip-path: polygon(0% 100%, 25.8% 0%, 100% 72.3%);
    filter: grayscale(1) contrast(1.05); }
</style>
</head>
<body>
  <div class="card">
    <div class="portrait"><div class="tri"></div><img src="../static/pictures/arnaldo.jpg" alt=""></div>
    <div class="copy">
      <p class="name">Arnaldo Pangia</p>
      <h1>AI Creative <span>Producer</span></h1>
      <p class="lede">Generative AI pipelines for images, video and brand assets. Berlin.</p>
    </div>
    <p class="url">arnaldopangia.com</p>
  </div>
</body>
</html>
